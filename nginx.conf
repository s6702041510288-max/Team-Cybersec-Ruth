events {}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://group_app:1337;
        }

        location /pgadmin/ {
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_pass http://group_admin:80/;
            proxy_redirect off;
        }
    }
}