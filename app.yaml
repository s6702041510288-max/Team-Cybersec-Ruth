services:
  group_app:
    image: prawee/strapi
    container_name: group-tuptim-app
    ports:
      - ${APP_PORT}:1337
    environment:
      DATABASE_CLIENT: ${APP_CLIENT}
      DATABASE_NAME: ${APP_DB_NAME}
      DATABASE_HOST: ${APP_HOST}
      DATABASE_PORT: ${APP_DB_PORT}
      DATABASE_USERNAME: ${APP_USERNAME}
      DATABASE_PASSWORD: ${APP_PASSWORD}
    networks:
      - secure-net